# One-command production-style stack:  docker compose --env-file deploy.env up -d --build
# See DEPLOYMENT.md. Copy deploy.env.example -> deploy.env and fill the values first.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    security_opt:
      - no-new-privileges:true
    # MongoDB is only reachable from the api container: it publishes no ports
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/motogear?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${SITE_URL}
      PUBLIC_URL: ${SITE_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-MotoGear <no-reply@localhost>}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/uploads
    # hardening: no privilege escalation, no Linux capabilities, read-only filesystem (only uploads + /tmp writable)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:5000
    ports:
      - "${WEB_PORT:-80}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101   # nginx renders its config here at start-up

volumes:
  mongo_data:
  uploads:
